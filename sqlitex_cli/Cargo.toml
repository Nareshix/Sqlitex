[package]
name = "sqlitex_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for sqlitex"

[[bin]]
name = "sqlitex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
toml = "1.1.5"
serde = { version = "1.0", features = ["derive"] }